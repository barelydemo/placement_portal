<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ app_name }}</title>

  <!-- Bootstrap 5 (the only CSS framework used in this project) -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="{{ asset('css/style.css') }}" />
</head>
<body class="bg-light">
  <!-- Jinja2 serves this shell ONLY. All dynamic UI is rendered by Vue below. -->
  <div id="app"></div>

  <!-- VueJS 3 via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/vue@3.4.31/dist/vue.global.prod.js"></script>
  <!-- Bootstrap bundle (includes Popper) for interactive components -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Shared state + components, then the root app (load order matters).
       asset() stamps each URL with the file's mtime so edits are never cached. -->
  <script src="{{ asset('js/store.js') }}"></script>
  <script src="{{ asset('js/components/login-form.js') }}"></script>
  <script src="{{ asset('js/components/register-form.js') }}"></script>
  <script src="{{ asset('js/components/company-profile.js') }}"></script>
  <script src="{{ asset('js/components/company-drives.js') }}"></script>
  <script src="{{ asset('js/components/admin-stats.js') }}"></script>
  <script src="{{ asset('js/components/admin-companies.js') }}"></script>
  <script src="{{ asset('js/components/admin-students.js') }}"></script>
  <script src="{{ asset('js/components/admin-drives.js') }}"></script>
  <script src="{{ asset('js/components/student-drives.js') }}"></script>
  <script src="{{ asset('js/components/student-applications.js') }}"></script>
  <script src="{{ asset('js/components/student-profile.js') }}"></script>
  <script src="{{ asset('js/app.js') }}"></script>
</body>
</html>
